apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicaCount.chat }}
  selector:
    matchLabels:
      app: chat
  template:
    metadata:
      labels:
        app: chat
    spec:
      containers:
        - name: chat
          image: "{{ .Values.images.chat.repository }}:{{ .Values.images.chat.tag }}"
          imagePullPolicy: {{ .Values.images.chat.pullPolicy }}
          ports:
            - containerPort: 3004
          envFrom:
            - configMapRef:
                name: streamingapp-config
            - secretRef:
                name: streamingapp-secret
          livenessProbe:
            tcpSocket:
              port: 3004
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 3004
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: chat
  ports:
    - port: {{ .Values.service.chat.port }}
      targetPort: {{ .Values.service.chat.targetPort }}
  type: {{ .Values.service.chat.type }}