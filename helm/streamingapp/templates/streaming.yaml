apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicaCount.streaming }}
  selector:
    matchLabels:
      app: streaming
  template:
    metadata:
      labels:
        app: streaming
    spec:
      containers:
        - name: streaming
          image: "{{ .Values.images.streaming.repository }}:{{ .Values.images.streaming.tag }}"
          imagePullPolicy: {{ .Values.images.streaming.pullPolicy }}
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: streamingapp-config
            - secretRef:
                name: streamingapp-secret
          livenessProbe:
            httpGet:
              path: /api/health/
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health/
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: streaming-service
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: streaming
  ports:
    - port: {{ .Values.service.streaming.port }}
      targetPort: {{ .Values.service.streaming.targetPort }}
  type: {{ .Values.service.streaming.type }}